<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stream Camera</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100%}body{min-height:100dvh}.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.panel{width:min(520px,100%);background:#111;border:1px solid #2a2a2a;border-radius:20px;padding:20px}.panel h1{margin:0 0 8px;font-size:24px}.muted{color:#aaa;font-size:14px}.buttons{display:grid;gap:12px;margin-top:18px}button{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#fff;color:#000}button.secondary{background:#292929;color:#fff}input{width:100%;font-size:20px;padding:14px;border-radius:12px;border:1px solid #444;background:#191919;color:#fff;margin-top:12px;text-transform:uppercase}#localVideo{width:100%;border-radius:16px;margin-top:16px;background:#050505;aspect-ratio:9/16;object-fit:cover;max-height:60dvh}#viewer{padding:0;background:#000}#remoteVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}#viewerStatus{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);background:#111e;padding:14px 18px;border-radius:12px;color:#ddd;text-align:center}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#252525;margin-top:12px;font-size:13px}.hidden{display:none!important}#diag{position:fixed;z-index:4;top:12px;left:12px;background:#111e;border:1px solid #444;border-radius:10px;padding:10px 12px;font:13px/1.45 monospace;white-space:pre-line;max-width:390px}#playBtn{position:fixed;z-index:5;left:50%;bottom:30px;transform:translateX(-50%);width:auto;padding:12px 20px}.ok{color:#8cffad}.warn{color:#ffd27a}</style></head><body>
<div id="home" class="page"><div class="panel"><h1>📱 Stream Camera</h1><div class="muted">Velg hvilken enhet du bruker.</div><div class="buttons"><button onclick="openCamera()">Jeg er på mobilen</button><button class="secondary" onclick="openViewer()">Jeg er på stream-PC-en</button></div></div></div>
<div id="camera" class="page hidden"><div class="panel"><h1>📷 Mobilkamera</h1><div id="camStatus" class="muted">Skriv samme romkode som på PC-en.</div><video id="localVideo" autoplay muted playsinline></video><input id="roomCode" maxlength="6" placeholder="ROMKODE" autocomplete="off"><div class="buttons"><button onclick="startCamera()">Start og koble til PC</button><button class="secondary" onclick="flipCamera()">🔄 Bytt kamera</button></div><div class="badge">Start PC-siden først. La Safari være åpen mens du sender.</div></div></div>
<div id="viewer" class="hidden"><video id="remoteVideo" autoplay playsinline></video><div id="viewerStatus"><b>Starter mottaker…</b><br><span id="codeText"></span></div><div id="diag">Diagnostikk starter…</div><button id="playBtn" class="hidden" onclick="forcePlay()">▶ Vis video</button></div>
<script>
let peer=null,stream=null,facing='environment',currentCall=null,remoteStream=null;const $=id=>document.getElementById(id);function randomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}function show(id){['home','camera','viewer'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function openCamera(){show('camera');history.replaceState(null,'','#camera')}function openViewer(){const c=randomCode();show('viewer');history.replaceState(null,'','#viewer='+c);startViewer(c)}
async function getMedia(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},audio:true});$('localVideo').srcObject=stream;return stream}
async function startCamera(){try{const code=$('roomCode').value.trim().toUpperCase();if(code.length<3){$('camStatus').textContent='Skriv romkoden som vises på PC-en.';return}$('camStatus').textContent='Starter kamera…';await getMedia();if(peer)peer.destroy();peer=new Peer();peer.on('open',()=>{$('camStatus').textContent='Kobler til PC…';currentCall=peer.call('streamviewer-'+code.toLowerCase(),stream);setInterval(()=>{if(currentCall?.peerConnection){$('camStatus').textContent=(currentCall.peerConnection.connectionState==='connected'?'🔴 Sender kamera til PC':'🟠 Tilkobling: '+currentCall.peerConnection.connectionState)}},1500)});peer.on('error',e=>$('camStatus').textContent='Feil: '+e.type)}catch(e){$('camStatus').textContent='Kunne ikke starte kamera: '+e.message}}
async function flipCamera(){facing=facing==='environment'?'user':'environment';if(!stream)return;try{const ns=await getMedia();if(currentCall){const pc=currentCall.peerConnection,vs=pc.getSenders().find(s=>s.track?.kind==='video'),as=pc.getSenders().find(s=>s.track?.kind==='audio');if(vs)await vs.replaceTrack(ns.getVideoTracks()[0]);if(as&&ns.getAudioTracks()[0])await as.replaceTrack(ns.getAudioTracks()[0])}}catch(e){$('camStatus').textContent='Kunne ikke bytte kamera: '+e.message}}
function diagnostics(){const v=$('remoteVideo'),tracks=remoteStream?.getTracks()||[],vt=remoteStream?.getVideoTracks()||[],at=remoteStream?.getAudioTracks()||[],pc=currentCall?.peerConnection;let t='🟢 Stream-event mottatt\n';t+='Video tracks: '+vt.length+' | Audio tracks: '+at.length+'\n';if(vt[0])t+='Video: '+vt[0].readyState+' / enabled='+vt[0].enabled+' / muted='+vt[0].muted+'\n';t+='Element: '+v.videoWidth+'x'+v.videoHeight+' | readyState='+v.readyState+'\n';t+='Playback: '+(v.paused?'PAUSED':'PLAYING')+' | currentTime='+v.currentTime.toFixed(1)+'\n';if(pc)t+='WebRTC: '+pc.connectionState+' | ICE: '+pc.iceConnectionState;$('diag').textContent=t}
async function forcePlay(){try{$('remoteVideo').muted=true;await $('remoteVideo').play();$('playBtn').classList.add('hidden');diagnostics()}catch(e){$('diag').textContent+='\nPlay-feil: '+e.message}}
function startViewer(code){$('codeText').innerHTML='Romkode: <b>'+code+'</b>';peer=new Peer('streamviewer-'+code.toLowerCase());peer.on('open',()=>{$('viewerStatus').innerHTML='<b>Venter på mobilen…</b><br>Romkode: <b>'+code+'</b><br><small>Skriv koden på mobilen og trykk Start.</small>';$('diag').textContent='Peer klar. Venter på stream…'});peer.on('call',call=>{currentCall=call;$('diag').textContent='Innkommende WebRTC-anrop mottatt…';call.answer();call.on('stream',async remote=>{remoteStream=remote;const v=$('remoteVideo');v.srcObject=remote;$('viewerStatus').classList.add('hidden');v.onloadedmetadata=()=>diagnostics();v.onplaying=()=>diagnostics();v.onresize=()=>diagnostics();try{await v.play()}catch(e){v.muted=true;try{await v.play()}catch(e2){$('playBtn').classList.remove('hidden')}}diagnostics();setInterval(diagnostics,1000)});call.on('close',()=>{$('viewerStatus').classList.remove('hidden');$('viewerStatus').innerHTML='<b>Mobilen koblet fra</b>'})});peer.on('error',e=>$('diag').textContent='Peer-feil: '+e.type)}
const hash=location.hash;if(hash.startsWith('#viewer=')){const c=hash.split('=')[1].toUpperCase();show('viewer');startViewer(c)}else if(hash==='#camera')openCamera();
</script></body></html>
