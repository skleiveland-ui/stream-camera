<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stream Camera</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100%}body{min-height:100dvh}.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(520px,100%);background:#111;border:1px solid #2a2a2a;border-radius:20px;padding:20px}.muted{color:#aaa;font-size:14px}.buttons{display:grid;gap:12px;margin-top:18px}button{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#fff;color:#000}button.secondary{background:#292929;color:#fff}input{width:100%;font-size:20px;padding:14px;border-radius:12px;border:1px solid #444;background:#191919;color:#fff;margin-top:12px;text-transform:uppercase}#localVideo{width:100%;border-radius:16px;margin-top:16px;background:#050505;aspect-ratio:9/16;object-fit:cover;max-height:60dvh}#remoteVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}#viewerStatus{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);background:#111e;padding:14px 18px;border-radius:12px;text-align:center}#diag{position:fixed;z-index:4;top:8px;left:8px;background:#111e;border:1px solid #444;border-radius:8px;padding:8px;font:12px/1.4 monospace;white-space:pre-line}.hidden{display:none!important}</style></head><body><div id="home" class="page"><div class="panel"><h2>📱 Stream Camera</h2><div class="muted">Velg enhet.</div><div class="buttons"><button onclick="openCamera()">Jeg er på mobilen</button><button class="secondary" onclick="openViewer()">Jeg er på stream-PC-en</button></div></div></div><div id="camera" class="page hidden"><div class="panel"><h2>📷 Mobilkamera</h2><div id="camStatus" class="muted">Start PC-siden først.</div><video id="localVideo" autoplay muted playsinline></video><input id="roomCode" maxlength="6" placeholder="ROMKODE"><div class="buttons"><button onclick="startCamera()">Start og koble til PC</button><button class="secondary" onclick="flipCamera()">🔄 Bytt kamera</button></div></div></div><div id="viewer" class="hidden"><video id="remoteVideo" autoplay muted playsinline></video><div id="viewerStatus"><b>Starter mottaker…</b><br><span id="codeText"></span></div><div id="diag">Starter…</div></div><script>
let peer,stream,currentCall,remoteStream,facing='environment',retryTimer;const $=x=>document.getElementById(x);const peerOpts={host:'0.peerjs.com',port:443,path:'/',secure:true,key:'peerjs',debug:2,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}],sdpSemantics:'unified-plan'}};function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}function show(x){['home','camera','viewer'].forEach(i=>$(i).classList.add('hidden'));$(x).classList.remove('hidden')}function openCamera(){show('camera');history.replaceState(null,'','#camera')}function openViewer(){let c=code();show('viewer');history.replaceState(null,'','#viewer='+c);startViewer(c)}async function media(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},audio:true});$('localVideo').srcObject=stream;return stream}
function newPeer(id){return id?new Peer(id,peerOpts):new Peer(peerOpts)}async function startCamera(){try{let c=$('roomCode').value.trim().toUpperCase();if(c.length<3)return $('camStatus').textContent='Skriv romkoden fra PC-en.';await media();if(peer)peer.destroy();$('camStatus').textContent='Kobler til signaling…';peer=newPeer();peer.on('open',()=>{ $('camStatus').textContent='Signaling OK. Kobler til PC…';currentCall=peer.call('streamviewer-'+c.toLowerCase(),stream);watchCall(currentCall)});peer.on('error',e=>$('camStatus').textContent='Peer-feil: '+e.type+' – '+(e.message||''));peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}})}catch(e){$('camStatus').textContent='Kamerafeil: '+e.message}}
function watchCall(call){let pc=call.peerConnection;setInterval(()=>{if(pc)$('camStatus').textContent=(pc.connectionState==='connected'?'🔴 Sender kamera til PC':'🟠 WebRTC: '+pc.connectionState+' / ICE: '+pc.iceConnectionState)},1000)}async function flipCamera(){facing=facing==='environment'?'user':'environment';let ns=await media();if(currentCall){let s=currentCall.peerConnection.getSenders().find(x=>x.track?.kind==='video');if(s)await s.replaceTrack(ns.getVideoTracks()[0])}}
function startViewer(c){$('codeText').innerHTML='Romkode: <b>'+c+'</b>';$('diag').textContent='Kobler til PeerJS Cloud…';if(peer)peer.destroy();peer=newPeer('streamviewer-'+c.toLowerCase());peer.on('open',id=>{$('viewerStatus').innerHTML='<b>Venter på mobilen…</b><br>Romkode: <b>'+c+'</b>';$('diag').textContent='🟢 Signaling OK\nID: '+id;clearTimeout(retryTimer)});peer.on('call',call=>{currentCall=call;$('diag').textContent+='\n🟢 Innkommende anrop';call.answer();call.on('stream',async r=>{remoteStream=r;let v=$('remoteVideo');v.srcObject=r;$('viewerStatus').classList.add('hidden');try{await v.play()}catch(e){};setInterval(()=>diag(),1000)})});peer.on('disconnected',()=>{$('diag').textContent+='\n🟠 Signaling frakoblet – prøver igjen';setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});peer.on('error',e=>{let msg='🔴 Peer-feil: '+e.type+'\n'+(e.message||'');$('diag').textContent=msg;if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){ $('viewerStatus').innerHTML='<b>Signaling-feil – prøver igjen…</b><br>Romkode: <b>'+c+'</b>';retryTimer=setTimeout(()=>startViewer(c),3000)}})}function diag(){let v=$('remoteVideo'),vt=remoteStream?.getVideoTracks()||[],at=remoteStream?.getAudioTracks()||[],pc=currentCall?.peerConnection;$('diag').textContent='🟢 Stream mottatt\nVideo: '+vt.length+' / Audio: '+at.length+'\nOppløsning: '+v.videoWidth+'x'+v.videoHeight+'\nPlayback: '+(v.paused?'paused':'playing')+'\nWebRTC: '+(pc?.connectionState||'?')+'\nICE: '+(pc?.iceConnectionState||'?')}
let h=location.hash;if(h.startsWith('#viewer=')){let c=h.split('=')[1].toUpperCase();show('viewer');startViewer(c)}else if(h==='#camera')openCamera();</script></body></html>
